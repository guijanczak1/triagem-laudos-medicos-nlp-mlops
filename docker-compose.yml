# Local observability stack (T18): api + prometheus + grafana on the
# default profile (no `profiles:` key on any of them -- they come up on a
# plain `docker compose up -d`). Services are kept in alphabetical order so
# another task can append a new service (e.g. T15's `airflow`, gated behind
# `profiles: ["airflow"]`) without reshuffling this file.
#
# Build the api image once before bringing the stack up:
#   docker build -f docker/Dockerfile.api -t triagem-api:local .
#
# Then:
#   docker compose config      # validate
#   docker compose up -d       # start api + prometheus + grafana
#   docker compose --profile airflow up -d   # also start airflow (T15)

services:
  airflow:
    # T15: Airflow standalone (webserver+scheduler+triggerer in one process,
    # sqlite metadata db) for dags/train_triagem_dag.py (T14). Gated behind
    # `profiles: ["airflow"]` -- opt-in, NEVER started by a plain
    # `docker compose up -d`; only `docker compose --profile airflow up -d`
    # brings it up, additively, alongside whatever is already running.
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    image: triagem-airflow:local
    profiles: ["airflow"]
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Local-only defaults; override via a real (gitignored) .env -- same
      # pattern as GF_SECURITY_ADMIN_* below (HARNESS §9.3/§9.4: never a
      # real credential committed here).
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      # Resolved to the container-side mount points below so the DAG's task
      # bodies (which read triagem.config.Settings) write into the same
      # ./data and ./models the host sees -- explicit rather than relying
      # on AIRFLOW_HOME being the process cwd.
      TRIAGEM_DATA_DIR: /opt/airflow/data
      TRIAGEM_RAW_DIR: /opt/airflow/data/raw
      TRIAGEM_PROCESSED_DIR: /opt/airflow/data/processed
      TRIAGEM_MODELS_DIR: /opt/airflow/models
      TRIAGEM_DATA_PATH: /opt/airflow/data/processed/laudos.csv
    volumes:
      # AIRFLOW_HOME itself (metadata db, logs, plugins) persists across
      # restarts in a named volume; the four bind mounts below override
      # just their own subpaths on top of it, so a DAG edit / fresh
      # dataset-or-model build on the host is picked up on container
      # restart without rebuilding this image.
      - airflow-home:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src:ro
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
    ports:
      - "8080:8080"
    networks:
      - triagem-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api:
    image: triagem-api:local
    # Image already bakes in models/ at build time (see docker/Dockerfile.api
    # for the rationale). This bind mount is a *local-dev convenience* so a
    # fresh `poetry run python -m triagem.training.train` / `onnx_export` on
    # the host is picked up on container restart without a rebuild; it does
    # not change how the image is built or how it behaves in CI/prod.
    volumes:
      - ./models:/app/models:ro
    ports:
      - "8000:8000"
    networks:
      - triagem-net
    restart: unless-stopped
    # HEALTHCHECK is already declared in docker/Dockerfile.api (GET /health);
    # reused as-is here, nothing to override.

  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # Local-only defaults; override by setting these in a real (gitignored)
      # .env -- never commit a real credential here (HARNESS §9.3/§9.4).
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      # T19: dashboard JSON lives outside provisioning/ on purpose (kept a
      # sibling of provisioning/, not nested in it) so the dashboards
      # file-provider (docker/grafana/provisioning/dashboards/dashboard.yml)
      # points at a plain folder instead of mixing dashboard JSON into the
      # same tree Grafana scans for datasource/provider YAML.
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - triagem-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.53.0
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - triagem-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  triagem-net:
    driver: bridge

volumes:
  grafana-data: {}
  prometheus-data: {}
  airflow-home: {}
