# Grafana datasource provisioning (T18) -- auto-registers Prometheus on
# container boot, no manual UI click required. Grafana loads every YAML
# file under provisioning/datasources/ on startup.
apiVersion: 1

datasources:
  - name: Prometheus
    # Fixed uid (T19): the provisioned dashboard (docker/grafana/dashboards/
    # triagem_api.json) references this exact uid in every panel's
    # datasource, so it never depends on Grafana's name->uid auto-hash and
    # never breaks if this datasource is ever renamed.
    uid: prometheus
    type: prometheus
    access: proxy
    # Compose service name (network DNS), not localhost -- Grafana and
    # Prometheus are separate containers on the same Compose network.
    url: http://prometheus:9090
    isDefault: true
    editable: false
