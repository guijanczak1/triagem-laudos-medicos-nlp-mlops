[tool.poetry]
name = "triagem-laudos-medicos-nlp-mlops"
version = "0.1.0"
description = "NLP-based clinical urgency triage assistant with a full MLOps pipeline (training, serving, monitoring)."
authors = ["Triagem Team"]
license = "MIT"
readme = "README.md"
packages = [{ include = "triagem", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pydantic-settings = "^2.5"
pandas = "^2.2"
scikit-learn = "^1.5"
requests = "^2.32"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.30" }
prometheus-client = "^0.20"
joblib = "^1.4"
skl2onnx = "^1.17"
onnx = "^1.16"
onnxruntime = "^1.19"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
ruff = "^0.6"
black = "^24.8"
mypy = "^1.11"
httpx = "^0.27"
types-requests = "^2.32"

# apache-airflow is intentionally OUT of the main dependency group: it does not
# install cleanly as a native Windows dependency. It only runs inside the
# Airflow Docker image (see docker/Dockerfile.airflow, T15). Install with
# `poetry install --with airflow` on Linux/CI/containers only.
[tool.poetry.group.airflow]
optional = true

[tool.poetry.group.airflow.dependencies]
apache-airflow = "^2.10"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["triagem"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "skl2onnx.*", "onnxruntime.*", "joblib.*", "onnx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--cov=src/triagem --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = [
    "network: marks tests that require network access (deselected by default)",
]
